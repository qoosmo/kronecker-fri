[package]
name = "kronecker-fri"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Abdelali Mkhida <ali.mkhida@algorizk.xyz>"]
description = "Kronecker-FRI: a hash-based multilinear polynomial commitment from a coefficient-extraction identity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qoosmo/kronecker-fri"
homepage = "https://qoosmo.github.io/kronecker-fri/"
documentation = "https://docs.rs/kronecker-fri"
readme = "README.md"
keywords = ["commitment", "fri", "zero-knowledge", "post-quantum", "multilinear"]
categories = ["cryptography", "mathematics"]
exclude = ["target/"]

[package.metadata.docs.rs]
all-features = true

[profile.release]
codegen-units = 1
lto = "fat"

[dependencies]
blake3 = "1.8.7"
rayon = { version = "1.12.0", optional = true }

[features]
# Multithreaded prover (commitment, opening, Merkle trees) with rayon. Off by default: the
# benchmarks of the paper are single-threaded. The proofs are identical with and without it.
parallel = ["dep:rayon"]

[dev-dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
