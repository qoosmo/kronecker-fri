name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      # Pinned to the toolchain of the paper's measurements, so that new lints in later
      # stable releases do not change the result of this workflow.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Clippy and tests with the parallel prover
        run: |
          cargo clippy --release --all-targets --features parallel -- -D warnings
          cargo test --release --features parallel
      - name: Same proofs with and without the parallel prover
        run: diff <(cargo run --release --example proof_digest) <(cargo run --release --features parallel --example proof_digest)
      - name: Quickstart
        run: cargo run --release --example quickstart
      - name: Small-field checks
        run: cargo run --release --example small_field_checks | tee checks.log && ! grep -q FAIL checks.log
      - name: Post-quantum bound
        run: cargo run --release --example pq_params
