name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      # Pinned to the toolchain of the paper's measurements, so that new lints in later
      # stable releases do not change the result of this workflow.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Clippy and tests with the parallel prover
        run: |
          cargo clippy --release --all-targets --features parallel,insecure-test-vectors -- -D warnings
          cargo test --release --features parallel
      - name: Test vectors (seeded proofs)
        run: cargo test --release --features insecure-test-vectors --test vectors
      - name: Same proofs with and without the parallel prover
        run: diff <(cargo run --release --features insecure-test-vectors --example proof_digest) <(cargo run --release --features parallel,insecure-test-vectors --example proof_digest)
      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - name: Package
        run: cargo publish --dry-run
      - name: Quickstart
        run: cargo run --release --example quickstart
      - name: Small-field checks
        run: cargo run --release --example small_field_checks | tee checks.log && ! grep -q FAIL checks.log
      - name: Post-quantum bound
        run: cargo run --release --example pq_params
  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      # rust-version of Cargo.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build with the minimum supported Rust version
        run: cargo build --release --all-targets --all-features
